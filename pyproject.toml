[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-redactor"
version = "0.4.0"
description = "Video object removal with modular selection, tracking, and background reconstruction"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3", "opencv-python>=4.8,<6", "Pillow>=10",
    "torch==2.7.1", "torchvision==0.22.1",
    "hydra-core>=1.3.2", "iopath>=0.1.10", "tqdm>=4.66.1",
    "transformers==4.51.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["redactor*"]
