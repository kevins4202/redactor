[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-redactor"
version = "0.3.0"
description = "Video object removal with modular selection, tracking, and background reconstruction"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3", "opencv-python>=4.8,<6", "Pillow>=10",
    "torch==2.7.1", "torchvision==0.22.1",
    "hydra-core>=1.3.2", "iopath>=0.1.10", "tqdm>=4.66.1",
]

[project.optional-dependencies]
text = ["transformers==4.51.3"]
test = ["pytest>=8", "httpx>=0.27,<1"]
ui = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18"]

[project.scripts]
redact = "redactor.cli:main"
redactor-ui = "redactor.server:main"

[tool.setuptools.packages.find]
include = ["redactor*"]

[tool.setuptools.package-data]
redactor = ["web/*.html", "web/*.css", "web/*.js"]
