<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redactor</title>
  <script src="assets/gsap.min.js"></script>
  <style>
    @font-face {
      font-family: "Redactor Syne";
      src: url("assets/syne.ttf") format("truetype");
      font-weight: 400 800;
      font-style: normal;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 1920px; height: 1080px; overflow: hidden;
      background: #f2f1e9; color: #243027;
      font-family: "Redactor Syne", sans-serif; font-synthesis: none;
    }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #f2f1e9; }
    .clip { position: absolute; inset: 0; }
    h1, h2, p { margin: 0; }
    .brand {
      inset: 54px auto auto 120px; font-size: 132px; font-weight: 800;
      line-height: 1.2; letter-spacing: -5px;
    }
    .state {
      inset: 112px 120px auto auto; font-size: 64px; font-weight: 500;
      line-height: 1.1; letter-spacing: -2px;
    }
    .footage {
      inset: 240px auto auto 120px; width: 1680px; height: 756px;
      object-fit: contain;
    }
    .closing-title {
      inset: 350px 120px auto 120px; font-size: 224px; font-weight: 800;
      line-height: 1.1; letter-spacing: -10px;
    }
    .closing-line {
      inset: 680px 120px auto 120px; font-size: 72px; font-weight: 500;
      line-height: 1.2; letter-spacing: -2px;
    }
  </style>
</head>
<body>
  <div data-hf-id="hf-1fhf" id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="12">
    <h1 data-hf-id="hf-ls4k" id="brand" class="clip brand" data-start="0" data-duration="10" data-track-index="1">Redactor</h1>
    <p data-hf-id="hf-pv1g" id="before-label" class="clip state" data-start="0" data-duration="5" data-track-index="2">Before</p>
    <p data-hf-id="hf-zt7f" id="after-label" class="clip state" data-start="5" data-duration="5" data-track-index="2">After</p>
    <video data-hf-id="hf-znj0" id="original" class="clip footage" src="assets/original.mp4" muted playsinline data-start="0" data-duration="5" data-media-start="0" data-track-index="0"></video>
    <video data-hf-id="hf-y81f" id="redacted" class="clip footage" src="assets/redacted.mp4" muted playsinline data-start="5" data-duration="5" data-media-start="0" data-track-index="0"></video>
    <h2 data-hf-id="hf-5bip" id="closing-title" class="clip closing-title" data-start="10" data-duration="2" data-track-index="1">Redactor</h2>
    <p data-hf-id="hf-6ybh" id="closing-line" class="clip closing-line" data-start="10" data-duration="2" data-track-index="2">Select. Track. Review.</p>
  </div>
  <script>
    // Hard cuts are owned by clip timing. Type stays still and fully legible.
    window.__timelines['main'] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
